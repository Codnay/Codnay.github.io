<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="A capsule's cross-section above a box. GJK measures from a core inflated by a small radius r_s, so its distance is r + g - r_s. Subtracting the whole radius r leaves g - r_s: the engine sees a surface r_s further out than the real one, so as the box comes up, contact fires while a real gap of r_s, 0.1 mm, remains.">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 5 H10" stroke="#16191a" stroke-width="2"/>
    </marker>
    <marker id="tb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 5 H10" stroke="#2a4f8f" stroke-width="2"/>
    </marker>
  </defs>
  <style>
    .t { font: 22px Georgia, "Times New Roman", serif; fill: #16191a; }
    .l { font: 500 13px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #6b6f6c; }
    .b { font: 500 13px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    /* 8 s loop: the core is inflated by r_s, GJK measures from it, the whole r is added back
       (a surface r_s too far out), and the box comes up until contact fires a gap r_s early */
    .m { transform-box: fill-box; transform-origin: 50% 50%; animation: 8s ease-in-out infinite; }
    .core { animation-name: core; } .clab { animation-name: clab; } .gjk { animation-name: gjk; }
    .gd { animation-name: gd; } .gh { opacity: 0; animation-name: gh; } .bx { animation-name: bx; }
    .hit { opacity: 0; animation-name: hit; }
    @keyframes core { 0%,10% { opacity: 1; transform: none; } 13% { opacity: 0; transform: none; } 15% { opacity: 0; transform: scale(.1); } 17% { opacity: 1; transform: scale(.1); } 27%,100% { opacity: 1; transform: none; } }
    @keyframes clab { 0%,10% { opacity: 1; } 13%,22% { opacity: 0; } 26%,37% { opacity: 1; } 40%,92% { opacity: 0; } 96%,100% { opacity: 1; } }
    @keyframes gjk { 0%,10% { opacity: 1; } 13%,28% { opacity: 0; } 33%,49% { opacity: 1; } 52%,90% { opacity: 0; } 95%,100% { opacity: 1; } }
    @keyframes gd { 0%,49% { opacity: 1; } 52%,90% { opacity: 0; } 95%,100% { opacity: 1; } }
    @keyframes gh { 0%,39% { opacity: 0; transform: scale(.167); } 41% { opacity: 1; transform: scale(.167); } 48%,86% { opacity: 1; transform: none; } 89%,100% { opacity: 0; transform: none; } }
    @keyframes bx { 0%,54% { transform: none; } 64%,86% { transform: translateY(-22px); } 93%,100% { transform: none; } }
    @keyframes hit { 0%,63% { opacity: 0; } 66%,85% { opacity: 1; } 88%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="420" height="300" fill="#f3f2ed"/>
  <text x="16" y="34" class="t">Where the 0.1 mm went</text>

  <!-- box -->
  <g class="m bx">
    <rect x="20" y="236" width="380" height="48" fill="#e6e5de" stroke="#16191a" stroke-width="1.5"/>
    <text x="32" y="266" class="s">box</text>
  </g>

  <!-- capsule cross-section and its inflated core -->
  <circle cx="140" cy="130" r="70" fill="none" stroke="#16191a" stroke-width="2"/>
  <circle class="m core" cx="140" cy="130" r="14" fill="none" stroke="#2a4f8f" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="140" cy="130" r="2.5" fill="#16191a"/>
  <text x="44" y="74" class="s">capsule</text>
  <g class="m clab">
    <text x="30" y="226" class="b">core + rₛ (drawn large)</text>
    <line x1="126" y1="130" x2="100" y2="210" stroke="#2a4f8f" stroke-width="1"/>
  </g>
  <!-- what the engine treats as the surface: the core plus the whole r, so r_s too far out -->
  <g class="m gh">
    <circle cx="140" cy="130" r="84" fill="none"/>
    <path d="M91.8 198.8A84 84 0 0 0 188.2 198.8" fill="none" stroke="#2a4f8f" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- guides -->
  <line x1="140" y1="130" x2="300" y2="130" stroke="#6b6f6c" stroke-dasharray="2 3"/>
  <line x1="140" y1="200" x2="236" y2="200" stroke="#6b6f6c" stroke-dasharray="2 3"/>

  <!-- r and g -->
  <line x1="230" y1="130" x2="230" y2="200" stroke="#16191a" stroke-width="1.5" marker-start="url(#t)" marker-end="url(#t)"/>
  <text x="238" y="170" class="l">r</text>
  <g class="m gd">
    <line x1="230" y1="200" x2="230" y2="236" stroke="#16191a" stroke-width="1.5" marker-start="url(#t)" marker-end="url(#t)"/>
    <text x="238" y="223" class="l">g</text>
  </g>

  <!-- what GJK returns -->
  <g class="m gjk">
    <line x1="154" y1="144" x2="300" y2="144" stroke="#2a4f8f" stroke-dasharray="2 3"/>
    <line x1="300" y1="144" x2="300" y2="236" stroke="#2a4f8f" stroke-width="2" marker-start="url(#tb)" marker-end="url(#tb)"/>
    <text x="308" y="178" class="b">GJK =</text>
    <text x="308" y="196" class="b">r + g − rₛ</text>
  </g>

  <!-- contact fires with a real gap of r_s left -->
  <g class="m hit">
    <circle cx="140" cy="214" r="3" fill="#2a4f8f"/>
    <line x1="230" y1="200" x2="230" y2="214" stroke="#2a4f8f" stroke-width="1.5" marker-start="url(#tb)" marker-end="url(#tb)"/>
    <text x="238" y="210" class="b">0.1 mm early</text>
  </g>
</svg>
