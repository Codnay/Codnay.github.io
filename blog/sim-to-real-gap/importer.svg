<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Four settings from an MJCF file pass through Newton's importer. The noslip options are lost (fixed in #5137, merged). A one-value solref arrives with damping ratio 0 instead of 1 (#5128). Explicit contact-pair properties land on another pair (#5121). The adhesion actuator is lost (#5190). None of these raises an error.">
  <style>
    .t { font: 22px Georgia, "Times New Roman", serif; fill: #16191a; }
    .l { font: 500 12px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #6b6f6c; }
    .b { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    .xm { font: 700 26px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    .pill { fill: #e6e5de; stroke: #16191a; stroke-width: 1.2; }
    .pk { fill: #16191a; opacity: 0; }
    .go, .bad, .drop, .show, .x { animation-duration: 8s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-fill-mode: both; }
    .go { animation-name: go; }
    .bad { animation-name: bad; }
    .drop { animation-name: drop; }
    .show { animation-name: show; }
    .x { animation-name: x; }
    .r1 { animation-delay: 0s; } .r2 { animation-delay: .5s; } .r3 { animation-delay: 1s; } .r4 { animation-delay: 1.5s; }
    @keyframes go { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 34%, 70% { transform: translateX(40px); opacity: 1; } 80%, 100% { transform: translateX(40px); opacity: 0; } }
    @keyframes bad { 0% { transform: translateX(0); opacity: 0; fill: #16191a; } 6% { opacity: 1; fill: #16191a; } 20% { fill: #16191a; } 26% { fill: #2a4f8f; } 34%, 70% { transform: translateX(40px); opacity: 1; fill: #2a4f8f; } 80%, 100% { transform: translateX(40px); opacity: 0; fill: #2a4f8f; } }
    @keyframes drop { 0% { transform: translate(0, 0); opacity: 0; } 6% { opacity: 1; } 22% { transform: translate(28px, 0); opacity: 1; } 40%, 100% { transform: translate(34px, 24px); opacity: 0; } }
    @keyframes show { 0%, 30% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes x { 0%, 22% { opacity: 0; } 28%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="420" height="300" fill="#f3f2ed"/>
  <text x="16" y="34" class="t">What the importer drops</text>
  <text x="16" y="56" class="s">MJCF file</text>
  <text x="214" y="56" class="s" text-anchor="middle">import</text>
  <text x="252" y="56" class="s">Newton model</text>
  <line x1="214" y1="66" x2="214" y2="266" stroke="#16191a" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- row 1: noslip lost -->
  <rect x="16" y="86" width="160" height="28" rx="4" class="pill"/>
  <text x="26" y="104" class="l">noslip_iterations</text>
  <rect x="182" y="95" width="12" height="10" class="pk drop r1"/>
  <text x="214" y="108" class="xm x r1" text-anchor="middle">×</text>
  <text x="252" y="98" class="b show r1">lost</text>
  <text x="252" y="114" class="s show r1">#5137, merged</text>

  <!-- row 2: solref damping -->
  <rect x="16" y="136" width="160" height="28" rx="4" class="pill"/>
  <text x="26" y="154" class="l">solref="0.02"</text>
  <rect x="182" y="145" width="12" height="10" class="pk bad r2"/>
  <text x="252" y="148" class="b show r2">damping 1 → 0</text>
  <text x="252" y="164" class="s show r2">#5128</text>

  <!-- row 3: pair on the wrong pair -->
  <rect x="16" y="186" width="160" height="28" rx="4" class="pill"/>
  <text x="26" y="204" class="l">&lt;pair friction&gt;</text>
  <rect x="182" y="195" width="12" height="10" class="pk bad r3"/>
  <text x="252" y="198" class="b show r3">on another pair</text>
  <text x="252" y="214" class="s show r3">#5121</text>

  <!-- row 4: adhesion lost -->
  <rect x="16" y="236" width="160" height="28" rx="4" class="pill"/>
  <text x="26" y="254" class="l">&lt;adhesion&gt;</text>
  <rect x="182" y="245" width="12" height="10" class="pk drop r4"/>
  <text x="214" y="258" class="xm x r4" text-anchor="middle">×</text>
  <text x="252" y="248" class="b show r4">lost</text>
  <text x="252" y="264" class="s show r4">#5190</text>

  <text x="16" y="290" class="s">No error. No warning.</text>
</svg>
