<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="The same cloth strip, clamped at one end, with the same bending stiffness in VBD. Meshed in 5 mm cells it bends and holds a curve. Meshed in 0.5 mm cells its bending is silently switched off and it hangs limp.">
  <style>
    .t { font: 22px Georgia, "Times New Roman", serif; fill: #16191a; }
    .l { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #6b6f6c; }
    .b { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    .seg { stroke-width: 4; stroke-linecap: round; }
    .j { transform-box: view-box; animation-duration: 6s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .a1 { transform-origin: 40px 104px; } .a2 { transform-origin: 70px 104px; } .a3 { transform-origin: 100px 104px; } .a4 { transform-origin: 130px 104px; }
    .b1 { transform-origin: 236px 104px; } .b2 { transform-origin: 266px 104px; } .b3 { transform-origin: 296px 104px; } .b4 { transform-origin: 326px 104px; }
    .stiff { transform: rotate(7deg); animation-name: stiff; }
    .limp { transform: rotate(22deg); animation-name: limp; }
    @keyframes stiff { 0%, 8% { transform: rotate(0deg); } 40%, 85% { transform: rotate(7deg); } 100% { transform: rotate(0deg); } }
    @keyframes limp { 0%, 8% { transform: rotate(0deg); } 40%, 85% { transform: rotate(22deg); } 100% { transform: rotate(0deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="420" height="260" fill="#f3f2ed"/>
  <text x="16" y="34" class="t">Fine cloth goes limp</text>
  <text x="16" y="56" class="s">same strip, same stiffness, VBD</text>

  <!-- left: 5 mm cells, bends -->
  <rect x="20" y="88" width="20" height="32" fill="#16191a"/>
  <g class="j a1 stiff"><line x1="40" y1="104" x2="70" y2="104" stroke="#16191a" class="seg"/>
    <g class="j a2 stiff"><line x1="70" y1="104" x2="100" y2="104" stroke="#16191a" class="seg"/>
      <g class="j a3 stiff"><line x1="100" y1="104" x2="130" y2="104" stroke="#16191a" class="seg"/>
        <g class="j a4 stiff"><line x1="130" y1="104" x2="160" y2="104" stroke="#16191a" class="seg"/></g></g></g></g>
  <text x="20" y="222" class="l">5 mm cells</text>
  <text x="20" y="238" class="s">bends</text>

  <!-- right: 0.5 mm cells, limp -->
  <rect x="216" y="88" width="20" height="32" fill="#16191a"/>
  <g class="j b1 limp"><line x1="236" y1="104" x2="266" y2="104" stroke="#2a4f8f" class="seg"/>
    <g class="j b2 limp"><line x1="266" y1="104" x2="296" y2="104" stroke="#2a4f8f" class="seg"/>
      <g class="j b3 limp"><line x1="296" y1="104" x2="326" y2="104" stroke="#2a4f8f" class="seg"/>
        <g class="j b4 limp"><line x1="326" y1="104" x2="356" y2="104" stroke="#2a4f8f" class="seg"/></g></g></g></g>
  <text x="216" y="222" class="l">0.5 mm cells</text>
  <text x="216" y="238" class="b">bending off</text>
  <text x="216" y="254" class="s">no warning</text>
</svg>
