<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" role="img" aria-label="Two runs add the same three float32 numbers in different orders. Run A adds 10^8, minus 10^8, then 1, and gets 1. Run B adds 10^8, then 1, which rounds away, then minus 10^8, and gets 0. Turned into 64-bit integers first, both orders give the same total.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b6f6c"/></marker>
  </defs>
  <style>
    .t { font: 22px Georgia, "Times New Roman", serif; fill: #16191a; }
    .h { font: 17px Georgia, "Times New Roman", serif; fill: #16191a; }
    .c { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #6b6f6c; }
    .b { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    .r { font: 500 20px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .rb { font: 500 20px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    /* 8 s loop: hold the result, then add A's numbers one by one, then B's */
    .n { transform-box: fill-box; transform-origin: 50% 50%; animation: 8s ease-in-out infinite; }
    .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; }
    .b1 { animation-name: b1; } .b2 { animation-name: b2; } .b3 { animation-name: b3; }
    .tmp { opacity: 0; }
    .ta1 { animation-name: ta1; } .ta2 { animation-name: ta2; } .tb1 { animation-name: tb1; }
    .eA { animation-name: eA; } .eB { animation-name: eB; } .eN { animation-name: eN; }
    @keyframes a1 { 0%,10% { opacity: 1; transform: none; } 14%,16% { opacity: .25; transform: translateY(-8px); } 20%,100% { opacity: 1; transform: none; } }
    @keyframes a2 { 0%,10% { opacity: 1; transform: none; } 14%,24% { opacity: .25; transform: translateY(-8px); } 28%,100% { opacity: 1; transform: none; } }
    @keyframes a3 { 0%,10% { opacity: 1; transform: none; } 14%,32% { opacity: .25; transform: translateY(-8px); } 36%,100% { opacity: 1; transform: none; } }
    @keyframes b1 { 0%,10% { opacity: 1; transform: none; } 14%,44% { opacity: .25; transform: translateY(-8px); } 48%,100% { opacity: 1; transform: none; } }
    @keyframes b2 { 0%,10% { opacity: 1; transform: none; } 14%,52% { opacity: .25; transform: translateY(-8px); } 56%,100% { opacity: 1; transform: none; } }
    @keyframes b3 { 0%,10% { opacity: 1; transform: none; } 14%,60% { opacity: .25; transform: translateY(-8px); } 64%,100% { opacity: 1; transform: none; } }
    @keyframes ta1 { 0%,18% { opacity: 0; } 20%,26% { opacity: 1; } 28%,100% { opacity: 0; } }
    @keyframes ta2 { 0%,26% { opacity: 0; } 28%,34% { opacity: 1; } 36%,100% { opacity: 0; } }
    @keyframes tb1 { 0%,46% { opacity: 0; } 48%,62% { opacity: 1; } 64%,100% { opacity: 0; } }
    @keyframes eA { 0%,10% { opacity: 1; } 13%,34% { opacity: 0; } 37%,100% { opacity: 1; } }
    @keyframes eN { 0%,10% { opacity: 1; } 13%,55% { opacity: 0; } 58%,100% { opacity: 1; } }
    @keyframes eB { 0%,10% { opacity: 1; } 13%,62% { opacity: 0; } 65%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="420" height="380" fill="#f3f2ed"/>
  <text x="16" y="34" class="t">Same numbers, different order</text>
  <text x="16" y="56" class="s">three threads add into one float32 total</text>

  <!-- Run A -->
  <text x="16" y="94" class="h">Run A</text>
  <g>
    <g class="n a1"><rect x="80" y="76" width="64" height="28" fill="#e6e5de" stroke="#16191a"/><text x="112" y="95" text-anchor="middle" class="c">+10⁸</text></g>
    <line x1="146" y1="90" x2="160" y2="90" stroke="#6b6f6c" marker-end="url(#a)"/>
    <g class="n a2"><rect x="162" y="76" width="64" height="28" fill="#e6e5de" stroke="#16191a"/><text x="194" y="95" text-anchor="middle" class="c">−10⁸</text></g>
    <line x1="228" y1="90" x2="242" y2="90" stroke="#6b6f6c" marker-end="url(#a)"/>
    <g class="n a3"><rect x="244" y="76" width="64" height="28" fill="#e6e5de" stroke="#16191a"/><text x="276" y="95" text-anchor="middle" class="c">+1</text></g>
    <text x="324" y="97" class="s">=</text>
    <text x="346" y="98" class="r n tmp ta1">10⁸</text>
    <text x="346" y="98" class="r n tmp ta2">0</text>
    <text x="346" y="98" class="r n eA">1</text>
  </g>
  <text x="80" y="122" class="s n eA">10⁸ → 0 → 1</text>

  <!-- Run B -->
  <text x="16" y="164" class="h">Run B</text>
  <g>
    <g class="n b1"><rect x="80" y="146" width="64" height="28" fill="#e6e5de" stroke="#16191a"/><text x="112" y="165" text-anchor="middle" class="c">+10⁸</text></g>
    <line x1="146" y1="160" x2="160" y2="160" stroke="#6b6f6c" marker-end="url(#a)"/>
    <g class="n b2"><rect x="162" y="146" width="64" height="28" fill="#e6e5de" stroke="#2a4f8f" stroke-width="1.5"/><text x="194" y="165" text-anchor="middle" class="b">+1</text></g>
    <line x1="228" y1="160" x2="242" y2="160" stroke="#6b6f6c" marker-end="url(#a)"/>
    <g class="n b3"><rect x="244" y="146" width="64" height="28" fill="#e6e5de" stroke="#16191a"/><text x="276" y="165" text-anchor="middle" class="c">−10⁸</text></g>
    <text x="324" y="167" class="s">=</text>
    <text x="346" y="168" class="r n tmp tb1">10⁸</text>
    <text x="346" y="168" class="rb n eB">0</text>
  </g>
  <text x="80" y="192" class="s n eB">10⁸ → 10⁸ → 0</text>
  <text x="80" y="208" class="b n eN">10⁸ + 1 rounds back to 10⁸</text>

  <line x1="16" y1="232" x2="404" y2="232" stroke="#d8d8d0"/>

  <!-- integer fix -->
  <text x="16" y="262" class="h">Our fix: add as integers</text>
  <text x="16" y="284" class="s">x̃ = round(x · 2ˢ), a 64-bit integer</text>
  <g>
    <text x="16" y="318" class="c">Run A</text>
    <text x="80" y="318" class="s">+10⁸·2ˢ  −10⁸·2ˢ  +2ˢ</text>
    <text x="324" y="318" class="s">=</text><text x="346" y="320" class="r n eA">2ˢ</text>
    <text x="16" y="350" class="c">Run B</text>
    <text x="80" y="350" class="s">+10⁸·2ˢ  +2ˢ  −10⁸·2ˢ</text>
    <text x="324" y="350" class="s">=</text><text x="346" y="352" class="r n eB">2ˢ</text>
  </g>
  <text x="16" y="374" class="s">integers add exactly, in any order</text>
</svg>
