<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" width="420" height="276" role="img" aria-label="Illustration, not measured data: reward over training on the same tower-stacking task. With physics where towers stand, reward rises smoothly and stays high. When towers fall at scale, reward is jagged, lower, and collapses several times.">
  <style>
