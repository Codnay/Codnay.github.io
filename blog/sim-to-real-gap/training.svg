    .b { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 7s ease-in-out infinite; }
    .late { animation-delay: .3s; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 45%, 88% { stroke-dashoffset: 0; opacity: 1; } 98%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    .lab { animation: lab 7s ease-in-out infinite; }
    @keyframes lab { 0%, 40% { opacity: 0; } 48%, 88% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
