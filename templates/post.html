  <article class="post-view" aria-labelledby="post-title">
    <a class="back" href="../">← writing</a>
    <header class="post-head">
      <span class="kicker"><time datetime="$date_iso">$date_long</time> · $read_time min read</span>
      <h1 id="post-title">$title</h1>
      <span class="byline">$byline</span>
    </header>
    <div class="prose">
$body
    </div>
    <div class="post-end">
      <a href="../">← all writing</a>
      <a href="../feed.xml">follow by rss</a>
    </div>
  </article>
  <script>
    // A Copy button on each BibTeX block.
    document.querySelectorAll(".prose pre > code.language-bibtex").forEach(function (code) {
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "copy"; btn.textContent = "Copy"; btn.setAttribute("aria-label", "Copy BibTeX");
      btn.addEventListener("click", function () {
        function done(label) { btn.textContent = label; setTimeout(function () { btn.textContent = "Copy"; }, 1500); }
        if (navigator.clipboard) navigator.clipboard.writeText(code.textContent).then(function () { done("Copied"); }, function () { done("Select and copy"); });
        else done("Select and copy");
      });
      var pre = code.parentNode, box = document.createElement("div");
      box.className = "codebox";
      pre.parentNode.insertBefore(box, pre);
      box.appendChild(pre); box.appendChild(btn);
    });
  </script>
