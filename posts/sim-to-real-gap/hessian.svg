<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" role="img" aria-label="Top: a bowl has one lowest point, so the factorization works and a ball settles at the bottom; a saddle curves down in one direction, so a ball rolls off it and the factorization takes the square root of a negative number. Bottom: on a log scale, float32 rounding error, about 5 times 10 to the minus 6, sits about 100,000 times above the Hessian's smallest eigenvalue, 6.4 times 10 to the minus 11. Float64 rounding error, about 10 to the minus 14, sits thousands of times below it.">
  <style>
    .t { font: 22px Georgia, "Times New Roman", serif; fill: #16191a; }
    .h { font: 17px Georgia, "Times New Roman", serif; fill: #16191a; }
    .l { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #6b6f6c; }
    .b { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    /* 7 s loop: a ball settles in the bowl; on the saddle it rolls off along the down-curving direction,
       and the float32 rounding marker pulses where it sits, far above the smallest eigenvalue */
    .ball, .roll { transform-box: fill-box; }
    .ball { animation: bowl 7s linear infinite; }
    .roll { opacity: 0; animation: roll 7s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 7s ease-in-out infinite; }
    @keyframes pulse { 0%,40% { transform: none; } 44% { transform: scale(1.5); } 48% { transform: none; } 52% { transform: scale(1.5); } 56%,100% { transform: none; } }
    @keyframes bowl{0%,8%{opacity:1;transform:none}10.9%{opacity:0;transform:none}11%{opacity:0;transform:translate(-48.0px,-25.9px)}14%{opacity:1;transform:translate(-48.0px,-25.9px)}15%{transform:translate(-43.0px,-20.8px)}16%{transform:translate(-35.4px,-14.0px)}17%{transform:translate(-26.0px,-7.6px)}18%{transform:translate(-15.8px,-2.8px)}19%{transform:translate(-5.7px,-0.4px)}20%{transform:translate(3.5px,-0.1px)}21%{transform:translate(11.3px,-1.4px)}22%{transform:translate(17.1px,-3.3px)}23%{transform:translate(20.9px,-4.9px)}24%{transform:translate(22.6px,-5.7px)}25%{transform:translate(22.3px,-5.6px)}26%{transform:translate(20.3px,-4.6px)}27%{transform:translate(17.0px,-3.2px)}28%{transform:translate(12.8px,-1.8px)}29%{transform:translate(8.2px,-0.7px)}30%{transform:translate(3.5px,-0.1px)}31%{transform:translate(-0.8px,-0.0px)}32%{transform:translate(-4.5px,-0.2px)}33%{transform:translate(-7.4px,-0.6px)}34%{transform:translate(-9.3px,-1.0px)}35%{transform:translate(-10.3px,-1.2px)}36%{transform:translate(-10.3px,-1.2px)}37%{transform:translate(-9.5px,-1.0px)}38%{transform:translate(-8.1px,-0.7px)}39%{transform:translate(-6.3px,-0.4px)}40%{transform:translate(-4.2px,-0.2px)}41%{transform:translate(-2.0px,-0.0px)}42%{transform:translate(-0.0px,-0.0px)}43%{transform:translate(1.8px,-0.0px)}44%{transform:translate(3.2px,-0.1px)}45%{transform:translate(4.1px,-0.2px)}46%{transform:translate(4.7px,-0.2px)}47%{transform:translate(4.8px,-0.3px)}48%{transform:translate(4.5px,-0.2px)}49%{transform:translate(3.9px,-0.2px)}50%{transform:translate(3.1px,-0.1px)}51%{transform:translate(2.1px,-0.1px)}52%{transform:translate(1.1px,-0.0px)}53%{transform:translate(0.2px,-0.0px)}54%{transform:translate(-0.7px,-0.0px)}55%{transform:translate(-1.3px,-0.0px)}56%{transform:translate(-1.8px,-0.0px)}57%{transform:translate(-2.1px,-0.0px)}58%{transform:translate(-2.2px,-0.1px)}59%{transform:translate(-2.1px,-0.0px)}60%{transform:translate(-1.8px,-0.0px)}61%{transform:translate(-1.5px,-0.0px)}62%{transform:translate(-1.1px,-0.0px)}63%{transform:translate(-0.6px,-0.0px)}64%{transform:translate(-0.2px,-0.0px)}65%{transform:translate(0.2px,-0.0px)}66%{transform:translate(0.6px,-0.0px)}67%{transform:translate(0.8px,-0.0px)}68%{transform:translate(0.9px,-0.0px)}69%{transform:translate(1.0px,-0.0px)}70%,100%{opacity:1;transform:none}}
    @keyframes roll{0%,12%{opacity:0;transform:none}16%,34%{opacity:1;transform:none}36%{opacity:1;transform:translate(0.2px,0.0px)}38%{opacity:1;transform:translate(0.7px,0.0px)}40%{opacity:1;transform:translate(1.5px,0.0px)}42%{opacity:1;transform:translate(2.8px,0.1px)}44%{opacity:1;transform:translate(4.5px,0.2px)}46%{opacity:1;transform:translate(6.7px,0.4px)}48%{opacity:1;transform:translate(9.5px,0.8px)}50%{opacity:1;transform:translate(13.2px,1.6px)}52%{opacity:1;transform:translate(17.7px,2.9px)}54%{opacity:1;transform:translate(23.4px,5.0px)}56%{opacity:1;transform:translate(30.5px,8.6px)}58%{opacity:0.67;transform:translate(39.4px,14.2px)}60%{opacity:0.33;transform:translate(50.4px,23.3px)}62%{opacity:0;transform:translate(64.0px,37.6px)}62.1%,100%{opacity:0;transform:translate(64px,37.6px)}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="420" height="440" fill="#f3f2ed"/>
  <text x="16" y="34" class="t">Rounding bigger than the curvature</text>

  <!-- bowl vs saddle -->
  <text x="16" y="66" class="h">Bowl</text>
  <path d="M30 86 Q100 196 170 86" fill="none" stroke="#16191a" stroke-width="2"/>
  <circle class="ball" cx="100" cy="141" r="4" fill="#16191a"/>
  <text x="16" y="178" class="l">every direction</text>
  <text x="16" y="194" class="l">curves up</text>
  <text x="16" y="212" class="s">factorization works</text>

  <text x="224" y="66" class="h">Saddle</text>
  <path d="M238 86 Q308 196 378 86" fill="none" stroke="#16191a" stroke-width="2"/>
  <path d="M238 160 Q308 70 378 160" fill="none" stroke="#2a4f8f" stroke-width="2" stroke-dasharray="5 4"/>
  <circle class="roll" cx="308" cy="115" r="4" fill="#16191a"/>
  <text x="224" y="178" class="l">one direction</text>
  <text x="224" y="194" class="b">curves down</text>
  <text x="224" y="212" class="s">√(negative) → NaN</text>

  <line x1="16" y1="234" x2="404" y2="234" stroke="#d8d8d0"/>

  <!-- log scale: 1e-16 at x=30, 1e2 at x=399, 20.5 px per decade -->
  <text x="16" y="262" class="h">On the light cable, log scale</text>
  <line x1="30" y1="350" x2="399" y2="350" stroke="#16191a" stroke-width="1.5"/>
  <g class="s" text-anchor="middle">
    <line x1="30" y1="350" x2="30" y2="356" stroke="#16191a"/><text x="30" y="372">10⁻¹⁶</text>
    <line x1="112" y1="350" x2="112" y2="356" stroke="#16191a"/><text x="112" y="372">10⁻¹²</text>
    <line x1="194" y1="350" x2="194" y2="356" stroke="#16191a"/><text x="194" y="372">10⁻⁸</text>
    <line x1="276" y1="350" x2="276" y2="356" stroke="#16191a"/><text x="276" y="372">10⁻⁴</text>
    <line x1="358" y1="350" x2="358" y2="356" stroke="#16191a"/><text x="358" y="372">10⁰</text>
  </g>

  <!-- smallest eigenvalue 6.4e-11 (x 149), largest 45 (x 392) -->
  <line x1="149" y1="350" x2="149" y2="300" stroke="#16191a" stroke-width="1"/>
  <circle cx="149" cy="350" r="5" fill="#16191a"/>
  <text x="104" y="284" class="l">smallest eigenvalue</text>
  <text x="104" y="299" class="s">6.4×10⁻¹¹</text>
  <line x1="392" y1="350" x2="392" y2="300" stroke="#16191a" stroke-width="1"/>
  <circle cx="392" cy="350" r="5" fill="#16191a"/>
  <text x="404" y="284" class="l" text-anchor="end">largest</text>
  <text x="404" y="299" class="l" text-anchor="end">45</text>

  <!-- rounding errors: float64 ~1e-14 (x 71), float32 ~5e-6 (x 250) -->
  <rect x="66" y="345" width="10" height="10" fill="#f3f2ed" stroke="#2a4f8f" stroke-width="2"/>
  <rect class="pulse" x="245" y="345" width="10" height="10" fill="#2a4f8f"/>
  <line x1="71" y1="356" x2="71" y2="388" stroke="#2a4f8f" stroke-width="1"/>
  <text x="30" y="404" class="b">float64</text>
  <text x="30" y="420" class="s">rounding</text>
  <line x1="250" y1="356" x2="250" y2="388" stroke="#2a4f8f" stroke-width="1"/>
  <text x="212" y="404" class="b">float32</text>
  <text x="212" y="420" class="s">rounding, ~10⁵× bigger</text>
</svg>
