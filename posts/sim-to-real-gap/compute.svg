<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 314" width="420" height="314" role="img" aria-label="Best world-steps per second on one L4, log scale: a falling body 1.3 times 10 to the 8; a Franka pick-and-place 1.8 times 10 to the 6; an ant robot 5.8 times 10 to the 5; a bin of 64 bodies 2.8 times 10 to the 4 with XPBD, 3,500 with Steel, 2,700 with Kamino and 630 with MuJoCo Warp.">
<style>.t{font:22px Georgia,"Times New Roman",serif;fill:#16191a}.h{font:17px Georgia,"Times New Roman",serif;fill:#16191a}.l{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;fill:#16191a}.s{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#6b6f6c}.b{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;fill:#2a4f8f}
/* 8 s loop: each row's dot slides out from the axis to its value, rows a beat apart */
.k{transform-box:fill-box;transform-origin:0 50%;animation:8s ease-in-out infinite;animation-delay:var(--d)}
.ln{animation-name:ln}.lb{animation-name:lb}.d1{animation-name:d1}.d2{animation-name:d2}.d3{animation-name:d3}.d4{animation-name:d4}.d5{animation-name:d5}.d6{animation-name:d6}.d7{animation-name:d7}
@keyframes ln{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:scaleX(0)}16%{opacity:1;transform:scaleX(0)}32%,100%{opacity:1;transform:none}}
@keyframes lb{0%,10%{opacity:1}13%,32%{opacity:0}35%,100%{opacity:1}}
@keyframes d1{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:translateX(-199.1px)}16%{opacity:1;transform:translateX(-199.1px)}32%,100%{opacity:1;transform:none}}
@keyframes d2{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:translateX(-138.6px)}16%{opacity:1;transform:translateX(-138.6px)}32%,100%{opacity:1;transform:none}}
@keyframes d3{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:translateX(-122.6px)}16%{opacity:1;transform:translateX(-122.6px)}32%,100%{opacity:1;transform:none}}
@keyframes d4{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:translateX(-79.7px)}16%{opacity:1;transform:translateX(-79.7px)}32%,100%{opacity:1;transform:none}}
@keyframes d5{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:translateX(-50.3px)}16%{opacity:1;transform:translateX(-50.3px)}32%,100%{opacity:1;transform:none}}
@keyframes d6{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:translateX(-46.6px)}16%{opacity:1;transform:translateX(-46.6px)}32%,100%{opacity:1;transform:none}}
@keyframes d7{0%,10%{opacity:1;transform:none}13%{opacity:0;transform:none}14%{opacity:0;transform:translateX(-26.0px)}16%{opacity:1;transform:translateX(-26.0px)}32%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="420" height="314" fill="#f3f2ed"/>
<text x="16" y="34" class="t">Clutter is where speed goes</text>
<text x="16" y="56" class="s">best world-steps per second, one L4, log scale</text>
<line x1="176.0" y1="72" x2="176.0" y2="284" stroke="#d8d8d0"/>
<line x1="208.6" y1="72" x2="208.6" y2="284" stroke="#d8d8d0"/>
<line x1="241.1" y1="72" x2="241.1" y2="284" stroke="#d8d8d0"/>
<line x1="273.7" y1="72" x2="273.7" y2="284" stroke="#d8d8d0"/>
<line x1="306.3" y1="72" x2="306.3" y2="284" stroke="#d8d8d0"/>
<line x1="338.9" y1="72" x2="338.9" y2="284" stroke="#d8d8d0"/>
<line x1="371.4" y1="72" x2="371.4" y2="284" stroke="#d8d8d0"/>
<line x1="404.0" y1="72" x2="404.0" y2="284" stroke="#d8d8d0"/>
<text x="176.0" y="300" text-anchor="middle" class="s">10²</text>
<text x="241.1" y="300" text-anchor="middle" class="s">10⁴</text>
<text x="306.3" y="300" text-anchor="middle" class="s">10⁶</text>
<text x="371.4" y="300" text-anchor="middle" class="s">10⁸</text>
<text x="16" y="90" class="l">Falling body</text>
<g style="--d:0.00s">
<line class="k ln" x1="176" y1="86" x2="375.1" y2="86" stroke="#6b6f6c" stroke-width="1"/>
<circle class="k d1" cx="375.1" cy="86" r="5" fill="#2a4f8f" stroke="#f3f2ed" stroke-width="2"/>
<text class="s k lb" x="365.1" y="78" text-anchor="end">1.3×10⁸</text>
</g>
<text x="16" y="120" class="l">Franka pick-place</text>
<g style="--d:0.12s">
<line class="k ln" x1="176" y1="116" x2="314.6" y2="116" stroke="#6b6f6c" stroke-width="1"/>
<circle class="k d2" cx="314.6" cy="116" r="5" fill="#2a4f8f" stroke="#f3f2ed" stroke-width="2"/>
<text class="s k lb" x="324.6" y="120">1.8×10⁶</text>
</g>
<text x="16" y="150" class="l">Ant robot</text>
<g style="--d:0.24s">
<line class="k ln" x1="176" y1="146" x2="298.6" y2="146" stroke="#6b6f6c" stroke-width="1"/>
<circle class="k d3" cx="298.6" cy="146" r="5" fill="#2a4f8f" stroke="#f3f2ed" stroke-width="2"/>
<text class="s k lb" x="308.6" y="150">5.8×10⁵</text>
</g>
<text x="16" y="180" class="l">Bin of 64: XPBD</text>
<g style="--d:0.36s">
<line class="k ln" x1="176" y1="176" x2="255.7" y2="176" stroke="#6b6f6c" stroke-width="1"/>
<circle class="k d4" cx="255.7" cy="176" r="5" fill="#2a4f8f" stroke="#f3f2ed" stroke-width="2"/>
<text class="s k lb" x="265.7" y="180">2.8×10⁴</text>
</g>
<text x="16" y="210" class="l">Bin of 64: Steel</text>
<g style="--d:0.48s">
<line class="k ln" x1="176" y1="206" x2="226.3" y2="206" stroke="#6b6f6c" stroke-width="1"/>
<circle class="k d5" cx="226.3" cy="206" r="5" fill="#2a4f8f" stroke="#f3f2ed" stroke-width="2"/>
<text class="s k lb" x="236.3" y="210">3.5×10³</text>
</g>
<text x="16" y="240" class="l">Bin of 64: Kamino</text>
<g style="--d:0.60s">
<line class="k ln" x1="176" y1="236" x2="222.6" y2="236" stroke="#6b6f6c" stroke-width="1"/>
<circle class="k d6" cx="222.6" cy="236" r="5" fill="#2a4f8f" stroke="#f3f2ed" stroke-width="2"/>
<text class="s k lb" x="232.6" y="240">2.7×10³</text>
</g>
<text x="16" y="270" class="l">Bin of 64: MJ Warp</text>
<g style="--d:0.72s">
<line class="k ln" x1="176" y1="266" x2="202.0" y2="266" stroke="#6b6f6c" stroke-width="1"/>
<circle class="k d7" cx="202.0" cy="266" r="5" fill="#2a4f8f" stroke="#f3f2ed" stroke-width="2"/>
<text class="s k lb" x="212.0" y="270">630</text>
</g>
</svg>
