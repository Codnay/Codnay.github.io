<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Top: near 2.2 radians, float32 values are 2.4 times 10 to the minus 7 apart. Each step a slow joint adds less than half that gap, so the new position rounds back to where it was. Bottom: the hand stays still but reports a velocity, and a tool it holds is carried out of the grasp, 1.4 mm in 2 seconds.">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a4f8f"/></marker>
  </defs>
  <style>
    .t { font: 22px Georgia, "Times New Roman", serif; fill: #16191a; }
    .l { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #6b6f6c; }
    .b { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    .dot { animation: nudge 3s ease-in-out infinite; transform-box: fill-box; }
    .arr { animation: try 3s ease-in-out infinite; }
    .back { animation: back 3s ease-in-out infinite; }
    .tool { animation: walk 7s linear infinite; }
    @keyframes nudge { 0%, 8% { transform: translateX(0); } 28%, 40% { transform: translateX(38px); } 46%, 100% { transform: translateX(0); } }
    @keyframes try { 0%, 6% { opacity: 0; } 12%, 40% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes back { 0%, 42% { opacity: .25; } 48%, 80% { opacity: 1; } 100% { opacity: .25; } }
    @keyframes walk { 0% { transform: translateY(0); opacity: 1; } 86% { transform: translateY(16px); opacity: 1; } 94% { transform: translateY(16px); opacity: 0; } 100% { transform: translateY(0); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="420" height="300" fill="#f3f2ed"/>
  <text x="16" y="34" class="t">Motion too small to keep</text>
  <text x="16" y="56" class="s">float32 values near 2.2 rad: 2.4×10⁻⁷ apart</text>

  <!-- float32 grid -->
  <line x1="30" y1="104" x2="390" y2="104" stroke="#16191a" stroke-width="1.5"/>
  <g stroke="#16191a" stroke-width="1.5">
    <line x1="80" y1="96" x2="80" y2="112"/>
    <line x1="210" y1="96" x2="210" y2="112"/>
    <line x1="340" y1="96" x2="340" y2="112"/>
  </g>
  <line x1="275" y1="92" x2="275" y2="116" stroke="#6b6f6c" stroke-dasharray="3 3"/>
  <text x="275" y="86" class="s" text-anchor="middle">half</text>
  <text x="210" y="130" class="l" text-anchor="middle">q</text>
  <text x="340" y="130" class="s" text-anchor="middle">next value</text>
  <line x1="214" y1="80" x2="248" y2="80" stroke="#2a4f8f" stroke-width="2" marker-end="url(#ab)" class="arr"/>
  <circle cx="210" cy="104" r="6" fill="#2a4f8f" class="dot"/>
  <text x="16" y="156" class="b">step &lt; half a gap</text>
  <text x="404" y="156" class="l back" text-anchor="end">rounds back to q</text>

  <line x1="16" y1="174" x2="404" y2="174" stroke="#d8d8d0"/>

  <!-- gripper and tool -->
  <rect x="120" y="190" width="104" height="12" fill="#16191a"/>
  <rect x="120" y="202" width="14" height="58" fill="#16191a"/>
  <rect x="210" y="202" width="14" height="58" fill="#16191a"/>
  <rect x="150" y="210" width="44" height="70" fill="#e6e5de" stroke="#2a4f8f" stroke-width="2" class="tool"/>
  <text x="246" y="210" class="l">hand: still,</text>
  <text x="246" y="226" class="s">reports speed</text>
  <text x="246" y="254" class="b">tool walks out</text>
  <text x="246" y="270" class="s">1.4 mm in 2 s</text>
</svg>
